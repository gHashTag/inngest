name: GHCR image (fork)

on:
  push:
    branches:
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build dev server UI
        run: make build-ui

      - name: Set version
        id: ver
        run: |
          base="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          sha="$(git rev-parse --short HEAD)"
          echo "version=${base}-mcp-auth.${sha}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOFLAGS: -mod=vendor
        run: |
          go build -ldflags "-s -w \
            -X github.com/inngest/inngest/pkg/inngest/version.Version=${{ steps.ver.outputs.version }} \
            -X github.com/inngest/inngest/pkg/inngest/version.Hash=${{ steps.ver.outputs.sha }}" \
            -o inngest ./cmd/

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.goreleaser
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ghashtag/inngest:mcp-auth
            ghcr.io/ghashtag/inngest:${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
